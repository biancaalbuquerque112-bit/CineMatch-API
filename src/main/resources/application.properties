
spring.application.name=cinematch-api

# Porta local: 8081
# Na nuvem, utiliza a porta fornecida pelo Railway
server.port=${PORT:8081}

# Permite receber conexoes externas
server.address=0.0.0.0

# ==========================================
# MYSQL
# ==========================================

# Local: MySQL do computador
# Nuvem: endereco configurado pelo Railway
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cinematch}

spring.datasource.username=${DB_USER:root}

spring.datasource.password=${DB_PASSWORD:${CINEMATCH_DB_PASSWORD:}}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver



spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000


server.error.include-message=never
server.error.include-stacktrace=never

# Nao executar scripts SQL automaticamente
spring.sql.init.mode=never
